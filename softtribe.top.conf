server {
    listen 80;
    listen 8080;
    server_name softtribe.top www.softtribe.top 134.175.230.107;

    # 静态前端资源目录
    root /var/www/softtribe.top/dist;
    index index.html;

    # 基础安全响应头
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    # Gzip 压缩支持
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # SEO 动态 Sitemap 与 Robots（反代至 Fastify，防止回退为 index.html）
    location ~* ^/(sitemap(-[a-z0-9-]+)?\.xml|robots\.txt)$ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    # SPA 前端路由支持 (HTML 强刷防缓存，保障每次发版即时生效)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # 前端静态哈希资源长期缓存（Vite assets 具备唯一指纹哈希，可安全长期缓存）
    location ~* ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 图像与媒体缓存
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API 接口反向代理至 Fastify 后端 (端口 3008)
    location /api/ {
        proxy_pass http://127.0.0.1:3008/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件静态目录代理
    location /uploads/ {
        alias /var/www/softtribe.top/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
