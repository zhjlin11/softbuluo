<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>网络连接暂时中断 - 软游部落</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #0b1329;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        box-sizing: border-box;
      }
      .card {
        max-width: 480px;
        margin: 20px;
        padding: 36px 32px;
        background: #131c2e;
        border-radius: 20px;
        box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
        border: 1px solid #1e293b;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: rgba(23, 105, 210, 0.15);
        color: #3b82f6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        font-size: 21px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #94a3b8;
        margin: 0 0 20px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: 9999px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.25);
        color: #60a5fa;
        font-size: 12px;
        margin-bottom: 20px;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #3b82f6;
        animation: pulse 1.8s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #1769d2;
        color: white;
        text-decoration: none;
        padding: 11px 28px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(23, 105, 210, 0.3);
      }
      .btn:hover {
        background: #1258b5;
        box-shadow: 0 6px 16px rgba(23, 105, 210, 0.4);
      }
      .tip-box {
        margin-top: 24px;
        padding: 14px 16px;
        background: rgba(30, 41, 59, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.6);
        border-radius: 12px;
        font-size: 12px;
        line-height: 1.6;
        color: #94a3b8;
        text-align: left;
      }
      .tip-box strong {
        color: #cbd5e1;
      }
      .tip-box code {
        background: rgba(0, 0, 0, 0.3);
        padding: 2px 6px;
        border-radius: 4px;
        color: #38bdf8;
        font-family: monospace;
      }
      .notice {
        margin-top: 24px;
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>您当前处于离线状态</h1>
      <p>检测到您与软游部落服务器的连接暂时中断。PWA 离线支持已保护本地缓存，连通后将自动为您加载最新内容。</p>

      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span id="status-text">正在后台自动重试连接...</span>
      </div>

      <div>
        <button class="btn" id="reload-btn" onclick="retryConnection()">重新检查网络连接</button>
      </div>

      <div class="tip-box">
        <strong>💡 为什么其他网站正常，唯独提示离线？</strong><br>
        软游部落部署在中国境内腾讯云高速服务器。若您当前开启了海外代理（如 Clash、VPN 或浏览器代理插件），海外节点连接国内服务器可能发生跨国路由抖动或连接重置。<br>
        <strong>建议解决方案</strong>：请在您的代理工具分流规则中，将 <code>softtribe.top</code> 设为 <strong>直连 (DIRECT)</strong>。
      </div>

      <div class="notice">软游部落 · 安全官方软件与游戏资源综合生态平台</div>
    </div>

    <script>
      let isChecking = false;

      async function retryConnection() {
        const statusText = document.getElementById('status-text');
        const btn = document.getElementById('reload-btn');
        if (statusText) statusText.innerText = '正在验证服务器连通性...';
        if (btn) btn.innerText = '连接中...';

        try {
          // 使用时间戳穿透缓存检测
          const res = await fetch('/?_ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
          if (res.ok || res.status < 500) {
            if (statusText) statusText.innerText = '✅ 连接已恢复，正在跳转...';
            setTimeout(() => { window.location.reload(); }, 300);
            return;
          }
        } catch (e) {
          // 依然处于离线或连接失败
        }

        if (statusText) statusText.innerText = '正在后台自动重试连接...';
        if (btn) btn.innerText = '重新检查网络连接';
      }

      // 后台轮询探测，一旦恢复自动刷新
      setInterval(() => {
        if (!navigator.onLine) return;
        fetch('/?_ping=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
          .then((res) => {
            if (res.ok || res.status < 500) {
              const statusText = document.getElementById('status-text');
              if (statusText) statusText.innerText = '✅ 连接已恢复，正在跳转...';
              setTimeout(() => { window.location.reload(); }, 400);
            }
          })
          .catch(() => {});
      }, 2500);

      window.addEventListener('online', retryConnection);
    </script>
  </body>
</html>
