# HTTPS 443 正式生产服务 (softtribe.top)
server {
    listen 443 ssl;
    server_name softtribe.top www.softtribe.top;

    root /var/www/softtribe.top/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # SEO 动态 Sitemap 与 Robots（反代至 Fastify 3008，防止 SPA try_files 回退为 index.html）
    location ~* ^/(sitemap(-[a-z0-9-]+)?\.xml|robots\.txt)$ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 严禁从前端公共目录直接下发可执行安装程序与压缩归档
    location ~* \.(?:exe|msi|zip|7z|dmg|pkg|deb|rpm|appimage)$ {
        return 404;
    }

    # 下载分发接口关闭缓冲、支持大文件流式断点，且禁止收录跳转链接
    location ^~ /api/v1/downloads/ {
        proxy_pass http://127.0.0.1:3008/api/v1/downloads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        add_header X-Robots-Tag "noindex, nofollow";
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3008/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/softtribe.top/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    ssl_certificate /etc/letsencrypt/live/softtribe.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/softtribe.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

